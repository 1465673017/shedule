<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5faf5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f5e8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  
  <!-- 标题 -->
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4a7c59">拖拽排课</text>
  
  <!-- 左侧科目池 -->
  <rect x="20" y="50" width="120" height="200" fill="white" stroke="#a8d5ba" stroke-width="2" rx="8"/>
  <text x="80" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c5530">科目池</text>
  
  <!-- 科目卡片 -->
  <rect x="30" y="80" width="100" height="25" fill="#FF0000" rx="4"/>
  <text x="80" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">数学</text>
  
  <rect x="30" y="115" width="100" height="25" fill="#0000FF" rx="4"/>
  <text x="80" y="131" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">语文</text>
  
  <!-- 正在拖拽的科目 -->
  <rect x="180" y="120" width="100" height="25" fill="#FF69B4" rx="4" filter="url(#shadow)" opacity="0.8"/>
  <text x="230" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">英语</text>
  
  <!-- 拖拽轨迹线 -->
  <path d="M 130 165 Q 180 140 230 132" stroke="#4a7c59" stroke-width="3" fill="none" stroke-dasharray="5,5" opacity="0.7"/>
  
  <!-- 右侧课程表 -->
  <rect x="300" y="50" width="80" height="150" fill="white" stroke="#a8d5ba" stroke-width="2" rx="8"/>
  <text x="340" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c5530">课程表</text>
  
  <!-- 表格头 -->
  <rect x="305" y="75" width="35" height="20" fill="#f8fdf8" stroke="#a8d5ba" stroke-width="1"/>
  <text x="322" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">周一</text>
  <rect x="340" y="75" width="35" height="20" fill="#f8fdf8" stroke="#a8d5ba" stroke-width="1"/>
  <text x="357" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">周二</text>
  
  <!-- 课程格子 -->
  <rect x="305" y="95" width="35" height="20" fill="#FF0000" stroke="#a8d5ba" stroke-width="1"/>
  <text x="322" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">数学</text>
  
  <!-- 高亮目标格子 -->
  <rect x="340" y="95" width="35" height="20" fill="#ffffcc" stroke="#4a7c59" stroke-width="3" stroke-dasharray="3,3"/>
  <text x="357" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a7c59">放置</text>
  
  <rect x="305" y="115" width="35" height="20" fill="#f8fdf8" stroke="#a8d5ba" stroke-width="1"/>
  <rect x="340" y="115" width="35" height="20" fill="#f8fdf8" stroke="#a8d5ba" stroke-width="1"/>
  
  <rect x="305" y="135" width="35" height="20" fill="#0000FF" stroke="#a8d5ba" stroke-width="1"/>
  <text x="322" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">语文</text>
  <rect x="340" y="135" width="35" height="20" fill="#f8fdf8" stroke="#a8d5ba" stroke-width="1"/>
  
  <!-- 鼠标指针 -->
  <path d="M 235 125 L 245 135 L 240 135 L 240 140 L 235 135 Z" fill="#2c5530"/>
  
  <!-- 拖拽指示箭头 -->
  <path d="M 280 132 L 295 132 L 290 127 M 295 132 L 290 137" stroke="#4a7c59" stroke-width="2" fill="none"/>
  
  <!-- 说明文字 -->
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">从科目池拖拽科目到课程表格中，高亮区域表示可放置位置</text>
</svg>
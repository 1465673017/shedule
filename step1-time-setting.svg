<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5faf5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f5e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  
  <!-- 标题 -->
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4a7c59">设置课时时间</text>
  
  <!-- 课时控制区域 -->
  <rect x="50" y="60" width="300" height="180" fill="white" stroke="#a8d5ba" stroke-width="2" rx="8"/>
  
  <!-- 上午课时 -->
  <text x="70" y="85" font-family="Arial, sans-serif" font-size="14" fill="#2c5530">上午课时</text>
  <rect x="150" y="70" width="30" height="25" fill="#4a7c59" rx="4"/>
  <text x="165" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">+</text>
  <rect x="190" y="70" width="30" height="25" fill="#dc3545" rx="4"/>
  <text x="205" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">-</text>
  
  <!-- 下午课时 -->
  <text x="70" y="125" font-family="Arial, sans-serif" font-size="14" fill="#2c5530">下午课时</text>
  <rect x="150" y="110" width="30" height="25" fill="#4a7c59" rx="4"/>
  <text x="165" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">+</text>
  <rect x="190" y="110" width="30" height="25" fill="#dc3545" rx="4"/>
  <text x="205" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">-</text>
  
  <!-- 晚上课时 -->
  <text x="70" y="165" font-family="Arial, sans-serif" font-size="14" fill="#2c5530">晚上课时</text>
  <rect x="150" y="150" width="30" height="25" fill="#4a7c59" rx="4"/>
  <text x="165" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">+</text>
  <rect x="190" y="150" width="30" height="25" fill="#dc3545" rx="4"/>
  <text x="205" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">-</text>
  
  <!-- 时间表格示例 -->
  <rect x="250" y="70" width="80" height="100" fill="#f8fdf8" stroke="#a8d5ba" stroke-width="1" rx="4"/>
  <text x="290" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c5530">时间</text>
  <line x1="250" y1="90" x2="330" y2="90" stroke="#a8d5ba" stroke-width="1"/>
  <text x="290" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">08:00</text>
  <text x="290" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">09:00</text>
  <text x="290" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">10:00</text>
  <text x="290" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">11:00</text>
  
  <!-- 箭头指示 -->
  <path d="M 230 120 L 245 120 L 240 115 M 245 120 L 240 125" stroke="#4a7c59" stroke-width="2" fill="none"/>
  
  <!-- 说明文字 -->
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">点击 + - 按钮调整课时数量，点击时间格修改时间</text>
</svg>
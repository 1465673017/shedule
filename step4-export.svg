<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5faf5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f5e8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  
  <!-- 标题 -->
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4a7c59">保存和导出</text>
  
  <!-- 完成的课程表 -->
  <rect x="50" y="50" width="120" height="100" fill="white" stroke="#a8d5ba" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="110" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c5530">我的课程表</text>
  
  <!-- 迷你课程表 -->
  <rect x="60" y="80" width="100" height="60" fill="#f8fdf8" stroke="#a8d5ba" stroke-width="1" rx="4"/>
  
  <!-- 表格内容 -->
  <rect x="65" y="85" width="20" height="12" fill="#FF0000" rx="2"/>
  <text x="75" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white">数学</text>
  
  <rect x="90" y="85" width="20" height="12" fill="#0000FF" rx="2"/>
  <text x="100" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white">语文</text>
  
  <rect x="115" y="85" width="20" height="12" fill="#FF69B4" rx="2"/>
  <text x="125" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white">英语</text>
  
  <rect x="65" y="102" width="20" height="12" fill="#FFA500" rx="2"/>
  <text x="75" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white">物理</text>
  
  <rect x="90" y="102" width="20" height="12" fill="#800080" rx="2"/>
  <text x="100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white">化学</text>
  
  <rect x="115" y="102" width="20" height="12" fill="#B8860B" rx="2"/>
  <text x="125" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white">生物</text>
  
  <!-- 导出按钮组 -->
  <rect x="220" y="60" width="150" height="140" fill="white" stroke="#4a7c59" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="295" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a7c59">导出选项</text>
  
  <!-- 保存图片按钮 -->
  <rect x="235" y="95" width="120" height="25" fill="#17a2b8" rx="6"/>
  <text x="295" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">📷 保存图片</text>
  
  <!-- 导出Word按钮 -->
  <rect x="235" y="130" width="120" height="25" fill="#007bff" rx="6"/>
  <text x="295" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">📄 导出Word</text>
  
  <!-- 导出Excel按钮 -->
  <rect x="235" y="165" width="120" height="25" fill="#28a745" rx="6"/>
  <text x="295" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">📊 导出Excel</text>
  
  <!-- 文件图标 -->
  <g transform="translate(50, 170)">
    <!-- PNG图片 -->
    <rect x="0" y="0" width="30" height="35" fill="#17a2b8" rx="3"/>
    <rect x="3" y="3" width="24" height="20" fill="white" rx="2"/>
    <text x="15" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">PNG</text>
    
    <!-- Word文档 -->
    <rect x="40" y="0" width="30" height="35" fill="#007bff" rx="3"/>
    <rect x="43" y="3" width="24" height="20" fill="white" rx="2"/>
    <text x="55" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">DOC</text>
    
    <!-- Excel表格 -->
    <rect x="80" y="0" width="30" height="35" fill="#28a745" rx="3"/>
    <rect x="83" y="3" width="24" height="20" fill="white" rx="2"/>
    <text x="95" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">XLS</text>
  </g>
  
  <!-- 箭头指示 -->
  <path d="M 175 110 L 215 110 L 210 105 M 215 110 L 210 115" stroke="#4a7c59" stroke-width="2" fill="none"/>
  <path d="M 175 125 L 215 135 L 210 130 M 215 135 L 210 140" stroke="#4a7c59" stroke-width="2" fill="none"/>
  <path d="M 175 140 L 215 160 L 210 155 M 215 160 L 210 165" stroke="#4a7c59" stroke-width="2" fill="none"/>
  
  <!-- 下载箭头 -->
  <path d="M 120 180 L 120 195 M 115 190 L 120 195 L 125 190" stroke="#4a7c59" stroke-width="3" fill="none"/>
  
  <!-- 说明文字 -->
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">选择导出格式，一键生成高质量文件</text>
</svg>
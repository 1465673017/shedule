name: macOS UI Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  screenshots:
    name: Capture on macOS
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Delete old workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' |
          while read -r artifact_id; do
            if [[ -n "$artifact_id" ]]; then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install Electron and Playwright
        run: npm ci

      - name: Capture every theme and dialog
        env:
          SCREENSHOT_DIR: artifacts/macos-screenshots
        run: npm run screenshots:macos

      - name: Upload macOS screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-screenshots-${{ github.run_number }}
          path: artifacts/macos-screenshots
          if-no-files-found: error
          retention-days: 7

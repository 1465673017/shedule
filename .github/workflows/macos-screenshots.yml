name: macOS UI Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'main.js'
      - 'preload.js'
      - 'js/**'
      - 'icon/**'
      - 'tests/macos-screenshots.js'
      - '.github/workflows/macos-screenshots.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  screenshots:
    name: Capture on macOS
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install Electron and Playwright
        run: npm ci

      - name: Capture every theme and dialog
        env:
          SCREENSHOT_DIR: artifacts/macos-screenshots
        run: npm run screenshots:macos

      - name: Upload macOS screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-screenshots-${{ github.run_number }}
          path: artifacts/macos-screenshots
          if-no-files-found: error
          retention-days: 30

name: Teacher Regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  teacher-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Run teacher regression gate
        run: npm run teacher:regression
      - name: Run shared SQLite data tests
        run: npm run scheduler:data:test
